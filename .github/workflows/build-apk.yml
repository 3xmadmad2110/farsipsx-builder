name: build-apk

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: 'New package name (e.g. com.farsipsx.bully)'
        required: true
        type: string
      appName:
        description: 'App label (e.g. Bully)'
        required: true
        type: string
      oldPackage:
        description: 'Package inside base.apk'
        required: true
        default: 'com.farsipsx.base'
        type: string
      oldLabel:
        description: 'Label inside base.apk'
        required: true
        default: 'FarsiPSX'
        type: string
      iconUrl:
        description: 'Optional PNG icon URL'
        required: false
        type: string
      releaseTag:
        description: 'Optional release tag (default: build-<packageName>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The base APK is stored as ordered chunks (small-request upload limited the uplink).
      # apktool is a public upstream release, so it is fetched here instead of uploaded.
      - name: Reconstruct base build assets
        run: |
          mkdir -p base tools
          cat chunks/base.apk.part* > base/base.apk
          test -s base/base.apk
          echo "base.apk $(wc -c < base/base.apk) bytes"
          curl -fL --retry 3 -o tools/apktool_3.0.3.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "apktool $(wc -c < tools/apktool_3.0.3.jar) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;36.0.0"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/36.0.0" >> $GITHUB_ENV

      - name: Decode keystore from secret
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/farsipsx.keystore"
          test -s "$RUNNER_TEMP/farsipsx.keystore"

      - name: Download icon (when provided)
        id: icon
        if: ${{ inputs.iconUrl != '' }}
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/icon.png" "${{ inputs.iconUrl }}"
          echo "path=$RUNNER_TEMP/icon.png" >> $GITHUB_OUTPUT

      - name: Build and sign APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          KEYSTORE_FILE: ${{ runner.temp }}/farsipsx.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          ICON_PATH: ${{ steps.icon.outputs.path }}
          INPUT_PKG: ${{ inputs.packageName }}
          INPUT_NAME: ${{ inputs.appName }}
          INPUT_OLD_PKG: ${{ inputs.oldPackage }}
          INPUT_OLD_LABEL: ${{ inputs.oldLabel }}
        run: |
          node -e '
            const fs=require("fs");
            const icon=process.env.ICON_PATH ? fs.readFileSync(process.env.ICON_PATH).toString("base64") : "";
            fs.writeFileSync("build-input.json", JSON.stringify({
              baseFile: "base/base.apk",
              packageName: process.env.INPUT_PKG,
              appName: process.env.INPUT_NAME,
              oldPackage: process.env.INPUT_OLD_PKG,
              oldLabel: process.env.INPUT_OLD_LABEL,
              iconBase64: icon
            }));
          '
          node tools/build-from-json.js build-input.json

      - name: Compute release tag
        id: vars
        run: |
          TAG="${{ inputs.releaseTag }}"
          if [ -z "$TAG" ]; then TAG="build-${{ inputs.packageName }}"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish release with APK and optional OBB/BIOS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ inputs.appName }} (${{ inputs.packageName }})
          body: |
            Built automatically by FarsiPSX panel.
            Tag: `${{ steps.vars.outputs.tag }}`
          files: |
            out/${{ inputs.packageName }}.apk
            data/${{ inputs.packageName }}/*
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Report URLs
        run: |
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/${{ inputs.packageName }}.apk"
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}"
